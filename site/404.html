<head>

  h1 { margin: 0 0 .5rem; }
  a.button { display:block; margin:.75rem 0; padding:1rem; border-radius:999px; text-align:center;
             background:var(--accent); color:var(--bg); text-decoration:none; font-weight:600; }
</style>
</head>

  <div id="links">
    <a class="button" id="play" href="#">Google Play</a>
    <a class="button" id="appstore" href="#">App Store</a>

<script src="/redirect.js"></script>
